apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
data:
  reconcile.sh: |
{{ `    #!/usr/bin/env bash
    # Pull actual per-instance effective EC2 costs (SP/RI/EDP/spot aware) from CUR
    # via Athena and push them to VictoriaMetrics as aws_node_effective_hourly_cost.
    set -euo pipefail

    PROFILE_ARG=""
    if [ -n "${CUR_ROLE_ARN:-}" ]; then
      mkdir -p ~/.aws
      cat > ~/.aws/config <<EOC
    [profile base]
    web_identity_token_file = ${AWS_WEB_IDENTITY_TOKEN_FILE}
    role_arn = ${AWS_ROLE_ARN}
    [profile cur]
    role_arn = ${CUR_ROLE_ARN}
    source_profile = base
    region = ${ATHENA_REGION}
    EOC
      PROFILE_ARG="--profile cur"
    fi
    export AWS_DEFAULT_REGION="${ATHENA_REGION}"

    # account id -> cluster label CASE expression
    CASE_EXPR=""
    ACCT_LIST=""
    IFS=',' read -ra PAIRS <<< "${ACCOUNT_CLUSTER_MAP}"
    for p in "${PAIRS[@]}"; do
      a="${p%%=*}"; c="${p#*=}"
      CASE_EXPR="${CASE_EXPR} WHEN '${a}' THEN '${c}'"
      ACCT_LIST="${ACCT_LIST}'${a}',"
    done
    ACCT_LIST="${ACCT_LIST%,}"

    # CUR granularity: auto (derive hours from usage_start/usage_end — exact for
    # hourly, daily and mixed exports), or explicit hourly / daily.
    case "${CUR_GRANULARITY:-auto}" in
      hourly) HOURS_EXPR="1" ;;
      daily)  HOURS_EXPR="24" ;;
      *)      HOURS_EXPR="greatest(1, max(date_diff('hour', line_item_usage_start_date, line_item_usage_end_date)))" ;;
    esac

    SQL="SELECT line_item_resource_id rid,
      cast(to_unixtime(line_item_usage_start_date)*1000 as bigint) ts,
      line_item_usage_account_id acct,
      CASE line_item_usage_account_id ${CASE_EXPR} ELSE 'unknown' END cl,
      regexp_extract(line_item_usage_type, ':(.+)$', 1) itype,
      CASE WHEN line_item_usage_type LIKE '%SpotUsage%' THEN 'spot'
           WHEN line_item_line_item_type = 'SavingsPlanCoveredUsage' THEN 'savings-plan'
           WHEN line_item_line_item_type = 'DiscountedUsage' THEN 'reserved'
           ELSE 'on-demand' END po,
      sum(CASE line_item_line_item_type
            WHEN 'SavingsPlanCoveredUsage' THEN savings_plan_savings_plan_effective_cost
            WHEN 'DiscountedUsage' THEN reservation_effective_cost
            ELSE line_item_unblended_cost END) cost,
      ${HOURS_EXPR} hrs
    FROM ${ATHENA_TABLE}
    WHERE line_item_usage_account_id IN (${ACCT_LIST})
      AND line_item_product_code = 'AmazonEC2'
      AND (line_item_usage_type LIKE '%BoxUsage%' OR line_item_usage_type LIKE '%SpotUsage%')
      AND line_item_resource_id LIKE 'i-%'
      AND line_item_line_item_type IN ('Usage','SavingsPlanCoveredUsage','DiscountedUsage')
      AND line_item_usage_start_date >= now() - interval '${LOOKBACK_DAYS}' day
    GROUP BY 1,2,3,4,5,6"

    echo "starting athena query..."
    QID=$(aws ${PROFILE_ARG} athena start-query-execution \
      --work-group "${ATHENA_WORKGROUP}" \
      --query-execution-context "Database=${ATHENA_DATABASE}" \
      --query-string "${SQL}" \
      --query QueryExecutionId --output text)

    ST="RUNNING"
    for i in $(seq 1 60); do
      ST=$(aws ${PROFILE_ARG} athena get-query-execution --query-execution-id "${QID}" \
        --query 'QueryExecution.Status.State' --output text)
      [ "${ST}" = "SUCCEEDED" ] && break
      if [ "${ST}" = "FAILED" ] || [ "${ST}" = "CANCELLED" ]; then
        aws ${PROFILE_ARG} athena get-query-execution --query-execution-id "${QID}" \
          --query 'QueryExecution.Status.StateChangeReason' --output text
        exit 1
      fi
      sleep 5
    done
    [ "${ST}" = "SUCCEEDED" ] || { echo "query timed out"; exit 1; }

    LOC=$(aws ${PROFILE_ARG} athena get-query-execution --query-execution-id "${QID}" \
      --query 'QueryExecution.ResultConfiguration.OutputLocation' --output text)
    aws ${PROFILE_ARG} s3 cp "${LOC}" /tmp/result.csv --quiet

    # CSV -> prometheus import format (skip header; strip quotes).
    # Each row covers hrs hours: emit one TRUE-hourly-rate sample per covered hour
    # so range queries (sum_over_time) integrate correctly on any granularity.
    tail -n +2 /tmp/result.csv | sed 's/"//g' | \
      awk -F',' '{ if ($7 != "" && $7 > 0 && $8 > 0) {
        rate = $7 / $8
        for (i = 0; i < $8; i++)
          printf "aws_node_effective_hourly_cost{provider_id=\"%s\",account=\"%s\",cluster=\"%s\",instance_type=\"%s\",purchase_option=\"%s\"} %.6f %d\n",
            $1, $3, $4, $5, $6, rate, $2 + i * 3600000 } }' > /tmp/import.txt

    N=$(wc -l < /tmp/import.txt)
    echo "pushing ${N} samples to ${VM_IMPORT_URL}"
    curl -fsS --data-binary @/tmp/import.txt "${VM_IMPORT_URL}"
    echo "done"
` }}
